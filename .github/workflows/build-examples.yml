name: Build ESP-IDF examples

on:
  push:
    paths:
      - "examples/**"
      - ".github/workflows/build-examples.yml"
  pull_request:
    paths:
      - "examples/**"
      - ".github/workflows/build-examples.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Discover examples
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.list.outputs.projects }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find ESP-IDF projects
        id: list
        shell: bash
        run: |
          set -euo pipefail

          projects="$(find examples -mindepth 2 -maxdepth 2 -type f -name CMakeLists.txt -printf '%h\n' | sort | jq -Rsc 'split("\n") | map(select(length > 0))')"

          if [[ "$projects" == "[]" ]]; then
            echo "No ESP-IDF projects were found under examples/." >&2
            exit 1
          fi

          echo "Testing projects: $projects"
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.project }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: false
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        project: ${{ fromJSON(needs.discover.outputs.projects) }}
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build example for ESP32-S31
        working-directory: ${{ matrix.project }}
        shell: bash
        env:
          IDF_TARGET: esp32s31
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          # ESP-IDF 6.1 only loads project-local idf.py extensions when this
          # trust flag is enabled. Without it, `bmgr` resolves to the built-in
          # command and rejects the Board Manager `-b` option.
          export IDF_EXTENSION_ALLOW_UNTRUSTED=1

          # sdkconfig is generated state.  The checked-in copy can be from a
          # different IDF/Board Manager run, and `set-target` may regenerate it
          # before the build.  For Board Manager projects, always regenerate
          # from the project and board defaults so the generated sdkconfig
          # contains the selected board's peripheral/device symbols.
          if [[ -f components/gen_bmgr_codes/board_manager.defaults ]]; then
            rm -f sdkconfig sdkconfig.old
            export SDKCONFIG_DEFAULTS="$PWD/sdkconfig.defaults;$PWD/components/gen_bmgr_codes/board_manager.defaults"
            idf.py bmgr -b tbao_s31_board -c ./boards
          fi

          idf.py --preview set-target "$IDF_TARGET"
          idf.py build
