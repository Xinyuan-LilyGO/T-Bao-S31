version: 1
board: tbao_s31_board
chip: esp32s31

devices:
  gpio_expander:
    type: gpio_expander
    peripherals:
    - i2c_master
    dependencies:
      sheldonix/esp_io_expander_xl9555: ^0.8.0

  lcd_brightness:
    type: ledc_ctrl
    peripherals:
    - ledc_backlight

  audio_dac:
    type: audio_codec
    peripherals:
    - i2s_audio_out
    - i2c_master

  audio_adc:
    type: audio_codec
    peripherals:
    - i2s_audio_in
    - i2c_master

  display_lcd:
    type: display_lcd
    sub_type: parlio
    dependencies:
      espressif/esp_lcd_st7796: '*'
    io:
      dc_gpio_num: 18
      clk_gpio_num: 17
      cs_gpio_num: 19
      data_gpio_nums: [44, 43, 42, 40, 39, 38, 37, 36]
      reset_gpio_num: 35

  lcd_touch:
    type: lcd_touch
    sub_type: i2c
    peripherals:
    - i2c_master
    dependencies:
      lambage/esp_lcd_touch_ft6336u: ^1.0.8

  fs_sdcard:
    type: fs_fat
    sub_type: sdmmc
    io:
      clk: 24
      cmd: 25
      d0: 20
      d1: 21
      d2: 22
      d3: 23

peripherals:
  i2c_master:
    type: i2c
    role: master
    io:
      sda_io_num: 0
      scl_io_num: 1

  i2s_audio_out:
    type: i2s
    role: master
    format: std-out
    io:
      mclk: 6
      bclk: 8
      ws: 9
      dout: 7
      din: 10

  i2s_audio_in:
    type: i2s
    role: master
    format: std-in
    io:
      mclk: 6
      bclk: 8
      ws: 9
      dout: 7
      din: 10

  ledc_backlight:
    type: ledc
    io:
      gpio_num: 16
