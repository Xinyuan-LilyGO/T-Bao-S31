dependencies:
  cmake_utilities: 0.*
  esp_cam_sensor:
    version: 2.6.*
  esp_h264:
    matches:
    - if: $CONFIG{ESP_VIDEO_USE_CUSTOMIZED_ESP_H264_VERSION} == False
    rules:
    - if: target in [esp32p4]
    version: 1.4.*
  esp_ipa:
    rules:
    - if: target in [esp32p4]
    version: 2.4.*
  idf: '>=5.4'
  usb_host_uvc:
    rules:
    - if: target in [esp32p4, esp32s3, esp32s31]
    version: 2.5.*
description: A framework designed to support Linux V4L2, multiple cameras and video
  streaming.
issues: https://github.com/espressif/esp-video-components/issues
repository: git://github.com/espressif/esp-video-components.git
repository_info:
  commit_sha: b15af0372a792a0ec86f4520775c254ae8fdc0d4
  path: esp_video
targets:
- esp32p4
- esp32s3
- esp32c3
- esp32c5
- esp32c6
- esp32c61
- esp32s31
url: https://github.com/espressif/esp-video-components/tree/master/esp_video
version: 2.5.0
